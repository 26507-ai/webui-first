<div class="gold-calculator-container">
    <h3 class="calc-title">Gold Jewelry Price Calculator</h3>
    
    <!-- Today's Rate Panel -->
    <div class="rate-display">
        <p>Aaja ko Sun ko Bhao (Per Tola): <strong id="current-rate-display">Rs. 1,50,000</strong></p>
    </div>

    <!-- Calculator Form -->
    <div class="calc-form">
        <div class="input-group">
            <label for="gold-rate">1. Today's Gold Rate (Per Tola - Rs.):</label>
            <input type="number" id="gold-rate" value="150000" placeholder="E.g. 150000">
        </div>

        <div class="input-group">
            <label for="gold-weight">2. Jewelry Weight (Tola):</label>
            <input type="number" id="gold-weight" step="0.01" value="1" placeholder="E.g. 1.5">
        </div>

        <div class="input-group">
            <label for="making-charge">3. Making Charge (Jyaala % per Tola):</label>
            <input type="number" id="making-charge" value="10" placeholder="E.g. 10">
        </div>

        <button onclick="calculateJewelryPrice()" class="calc-btn">Calculate Total Price</button>
    </div>

    <!-- Result Display -->
    <div class="calc-result" id="calc-result-box" style="display:none;">
        <h4>Price Breakdown:</h4>
        <p>Gold Cost: <span id="res-gold-cost">Rs. 0</span></p>
        <p>Making Charge (<span id="res-making-percent">0</span>%): <span id="res-making-cost">Rs. 0</span></p>
        <hr>
        <p class="final-price">Total Price: <span id="res-total">Rs. 0</span></p>
    </div>
</div>

<!-- CSS Styling (Website ma milauna ko lagi) -->
<style>
    .gold-calculator-container {
        max-width: 450px;
        margin: 20px auto;
        padding: 25px;
        background: #fffdf6;
        border: 2px solid #dfb75c;
        border-radius: 12px;
        font-family: Arial, sans-serif;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.05);
    }
    .calc-title {
        color: #8c6c1d;
        text-align: center;
        margin-top: 0;
    }
    .rate-display {
        background: #fdf5df;
        padding: 10px;
        border-radius: 6px;
        text-align: center;
        border-left: 5px solid #dfb75c;
        margin-bottom: 20px;
    }
    .input-group {
        margin-bottom: 15px;
    }
    .input-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: #444;
    }
    .input-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
    }
    .calc-btn {
        width: 100%;
        padding: 12px;
        background: #dfb75c;
        border: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
    }
    .calc-btn:hover {
        background: #bc933a;
    }
    .calc-result {
        margin-top: 20px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 8px;
        border-top: 3px solid #28a745;
    }
    .final-price {
        font-size: 18px;
        font-weight: bold;
        color: #28a745;
    }
</style>

<!-- JavaScript Engine (Calculation Logic) -->
<script>
    function calculateJewelryPrice() {
        // Form bat values line
        var rate = parseFloat(document.getElementById('gold-rate').value);
        var weight = parseFloat(document.getElementById('gold-weight').value);
        var makingChargePercent = parseFloat(document.getElementById('making-charge').value);

        if (isNaN(rate) || isNaN(weight) || isNaN(makingChargePercent)) {
            alert("Sahi details rakhnus!");
            return;
        }

        // Calculation garne logic
        var goldCost = rate * weight;
        var makingCost = (goldCost * makingChargePercent) / 100;
        var totalPrice = goldCost + makingCost;

        // UI update rate dynamically
        document.getElementById('current-rate-display').innerText = "Rs. " + rate.toLocaleString('en-IN');
        document.getElementById('res-gold-cost').innerText = "Rs. " + goldCost.toLocaleString('en-IN');
        document.getElementById('res-making-percent').innerText = makingChargePercent;
        document.getElementById('res-making-cost').innerText = "Rs. " + makingCost.toLocaleString('en-IN');
        document.getElementById('res-total').innerText = "Rs. " + totalPrice.toLocaleString('en-IN');

        // Result box dekhaune
        document.getElementById('calc-result-box').style.display = 'block';
    }
</script>
